[project]
name = "todo-cli-app"
version = "0.1.0"
description = "A highly polished, feature-rich TODO CLI app."
authors = ["Your Name <you@example.com>"]
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["todo_cli*"]
exclude = ["tests*"]
